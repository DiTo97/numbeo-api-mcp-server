name: CI
on:
  pull_request:
    branches: [main]

jobs:
  linting-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛎️ checkout
        uses: actions/checkout@v7

      - name: 📦 uv
        uses: astral-sh/setup-uv@v7

      - name: 🐍 set up venv
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: 🦾 sync
        run: make sync

      - name: 💅 linting
        run: make linting

      - name: 🧪 test
        run: make test

      - name: 📦 requirements
        run: make export
